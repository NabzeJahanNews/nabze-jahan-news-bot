name: Nabze Jahan News Bot
on:
  workflow_dispatch:
  schedule:
    - cron: '0 * * * *'

jobs:
  news:
    env:
        BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        ADMIN_ID: "@NabzeJahanNews"
    runs-on: ubuntu-latest
    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Run news bot
        run: python news.py
